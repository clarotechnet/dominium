server {
    listen 80;
    listen [::]:80;
    server_name dominium.seudominio.com.br;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name dominium.seudominio.com.br;

    # Certbot/Hostinger deve preencher os caminhos reais do certificado.
    ssl_certificate /etc/letsencrypt/live/dominium.seudominio.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dominium.seudominio.com.br/privkey.pem;

    client_max_body_size 25m;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 15s;
        proxy_send_timeout 330s;
        proxy_read_timeout 330s;
        proxy_buffering off;
    }

    access_log /var/log/nginx/dominium.access.log;
    error_log /var/log/nginx/dominium.error.log;
}
