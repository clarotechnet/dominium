name: Verificar deploy Hostinger

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-hostinger-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Verificar secrets de deploy
        shell: bash
        env:
          HOSTINGER_FTP_SERVER: ${{ secrets.HOSTINGER_FTP_SERVER }}
          HOSTINGER_FTP_USERNAME: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          HOSTINGER_FTP_PASSWORD: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
        run: |
          missing=0
          for name in HOSTINGER_FTP_SERVER HOSTINGER_FTP_USERNAME HOSTINGER_FTP_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret ausente: $name"
              missing=1
            else
              echo "Secret disponivel: $name"
            fi
          done
          exit "$missing"
