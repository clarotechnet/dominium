name: Identificar app Hostinger DOMINIUM

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/inspect-hostinger-api.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar Hostinger CLI oficial
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/hostinger/api-cli/releases/latest"
          url="$(curl -fsSL "$api" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(a["browser_download_url"] for a in d["assets"] if a["name"].endswith("linux-amd64.tar.gz")))')"
          curl -fsSL "$url" -o /tmp/hostinger.tar.gz
          mkdir -p "$HOME/bin"
          tar -xzf /tmp/hostinger.tar.gz -C "$HOME/bin"
          chmod +x "$HOME/bin/hostinger"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Validar token e localizar DOMINIUM
        shell: bash
        env:
          HOSTINGER_API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$HOSTINGER_API_TOKEN" || { echo "::error::HOSTINGER_API_TOKEN ausente"; exit 1; }

          echo "=== CLI ==="
          hostinger version

          echo "=== WEBSITE ==="
          hostinger hosting websites list --domain dominium.clarotechnet.com.br --format json

          echo "=== NODEJS HELP ==="
          hostinger hosting nodejs --help

          echo "=== NODEJS LIST HELP ==="
          hostinger hosting nodejs list --help || true
