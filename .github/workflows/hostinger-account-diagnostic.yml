name: Diagnosticar conta Hostinger

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/hostinger-account-diagnostic.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Instalar Hostinger CLI oficial
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/hostinger/api-cli/releases/latest"
          url="$(curl -fsSL "$api" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(a["browser_download_url"] for a in d["assets"] if a["name"].endswith("linux-amd64.tar.gz")))')"
          curl -fsSL "$url" -o /tmp/hostinger.tar.gz
          mkdir -p "$HOME/bin"
          tar -xzf /tmp/hostinger.tar.gz -C "$HOME/bin"
          chmod +x "$HOME/bin/hostinger"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Inspecionar recursos visiveis
        shell: bash
        env:
          HOSTINGER_API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$HOSTINGER_API_TOKEN" || { echo "::error::HOSTINGER_API_TOKEN ausente"; exit 1; }

          echo "=== HOSTING WEBSITES ==="
          hostinger hosting websites list --format json || true

          echo "=== AGENCY ORDERS ==="
          hostinger agency-hosting orders list --format json || true

          echo "=== AGENCY WEBSITES ==="
          hostinger agency-hosting websites list-plan --format json || true

          echo "=== AGENCY DOMINIUM FILTER ==="
          hostinger agency-hosting websites list-plan --domain dominium.clarotechnet.com.br --format json || true

          echo "=== NODE BUILD SETTINGS ==="
          hostinger hosting nodejs build-settings u998431343 dominium.clarotechnet.com.br --format json || true

          echo "=== NODE BUILDS ==="
          hostinger hosting nodejs list-builds u998431343 dominium.clarotechnet.com.br --per-page 5 --format json || true

          echo "=== GIT AUTO DEPLOY ==="
          hostinger hosting git auto-deployment-settings u998431343 dominium.clarotechnet.com.br --format json || true

          echo "=== GIT INSTALLATIONS ==="
          hostinger hosting git list-installations --format json || true

          echo "=== WEBSITE FILES ==="
          hostinger hosting files list-website-and-directories u998431343 dominium.clarotechnet.com.br --max-depth 2 --max-items 250 --format json || true

          echo "=== PACKAGE JSON ==="
          hostinger hosting files website-content u998431343 dominium.clarotechnet.com.br --path package.json --max-lines 200 --format json || true

          echo "=== SERVER JS HEAD ==="
          hostinger hosting files website-content u998431343 dominium.clarotechnet.com.br --path server.js --max-lines 260 --format json || true

