name: Deploy Hostinger DOMINIUM

on:
  push:
    branches: [main, codex/ui-desc-20261010]
    paths:
      - "static/**"
      - "deploy/hostinger-web/**"
      - "scripts/build_hostinger_node_release.py"
      - ".github/workflows/hostinger-account-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dominium-hostinger-production
  cancel-in-progress: false

jobs:
  validate-and-deploy:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip deploy]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HOSTINGER_USERNAME: u998431343
      HOSTINGER_DOMAIN: dominium.clarotechnet.com.br

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: deploy/hostinger-web/package-lock.json

      - name: Validar runtime e montar release
        env:
          DOMINIUM_DESC_REVIEW_CONNECTION: ${{ secrets.DOMINIUM_DESC_REVIEW_CONNECTION }}
        shell: bash
        run: |
          set -euo pipefail
          node --check deploy/hostinger-web/server.js
          node --test tests/test_order_dataset_hostinger.js tests/test_operational_relay.js tests/test_disconnection_hostinger.js tests/test_confront_frontend.js tests/test_query_import.js tests/test_atlas_query_policy.js tests/test_atlas_query_ui_status.js
          node --test tests/test_import_hostinger.js integrations/import_bridge/worker.test.mjs
          npm ci --prefix deploy/hostinger-web --ignore-scripts --no-audit --no-fund
          npm run build --prefix deploy/hostinger-web
          python -m unittest tests.test_build_hostinger_node_release tests.test_hostinger_runtime_dependencies -v
          python scripts/build_hostinger_node_release.py
          node -e "const runtime = require('./output/hostinger-node-release/operational-relay.js'); if (typeof runtime.resolveOperationalRead !== 'function') process.exit(1); console.log('Release Node require smoke: OK')"
          test -s output/hostinger-node-release.zip

      - name: Verificar ponte privada de importacao sem importar dados
        env:
          DOMINIUM_DESC_REVIEW_CONNECTION: ${{ secrets.DOMINIUM_DESC_REVIEW_CONNECTION }}
        shell: bash
        run: |
          node <<'NODE'
          const crypto = require('node:crypto');
          const { createImportMiddleware } = require('./deploy/hostinger-web/import-proxy');
          const token = JSON.parse(process.env.DOMINIUM_DESC_REVIEW_CONNECTION).token;
          const handler = createImportMiddleware({ connection: () => ({token}) });
          (async () => {
            for (const [method, originalUrl, expected] of [
              ['GET', '/api/import-targets', 200],
              ['POST', '/api/imports/preview', 400],
            ]) {
              const req = {method, originalUrl, headers: {'x-csrf-token':'verification'}, body: {},
                dominiumUser:{role:'controller',display_name:'Verificacao tecnica'},
                dominiumSession:{csrf_hash:crypto.createHash('sha256').update('verification').digest('hex')}};
              const res = {code:0, set(){return this;}, status(n){this.code=n;return this;},
                json(body){this.body=body;return this;}, send(body){this.body=JSON.parse(body);return this;}};
              await handler(req,res);
              if (res.code !== expected || (method === 'GET' && !res.body.ok)) {
                throw new Error('Ponte privada falhou: '+method+' '+originalUrl+' HTTP '+res.code);
              }
              console.log('Ponte privada: '+method+' '+originalUrl+' HTTP '+res.code);
            }
            const { createDisconnectionMiddleware, resolveReviewOrigin } = require('./deploy/hostinger-web/disconnection-proxy');
            const stored = JSON.parse(process.env.DOMINIUM_DESC_REVIEW_CONNECTION);
            const desc = createDisconnectionMiddleware({connection:()=>({origin:resolveReviewOrigin(stored.origin),token:stored.token})});
            const req = {method:'GET',originalUrl:'/api/disconnection/state',headers:{},
              dominiumUser:{id:1,role:'controller',display_name:'Verificacao tecnica'},dominiumSession:{csrf_hash:'verification'}};
            const res = {code:0,set(){return this;},status(n){this.code=n;return this;},
              json(body){this.body=body;return this;},send(body){this.body=JSON.parse(body);return this;}};
            await desc(req,res);
            if(res.code!==200 || !Array.isArray(res.body.batches)) throw new Error('Painel DESC privado indisponivel: HTTP '+res.code);
            console.log('Painel DESC: HTTP 200, estrutura de lotes confirmada');
          })().catch(error=>{console.error(error.message);process.exitCode=1;});
          NODE

      - name: Verificar ponte operacional privada antes do deploy
        shell: bash
        env:
          DOMINIUM_DESC_REVIEW_CONNECTION: ${{ secrets.DOMINIUM_DESC_REVIEW_CONNECTION }}
        run: |
          node <<'NODE'
          (async () => {
            const {token} = JSON.parse(process.env.DOMINIUM_DESC_REVIEW_CONNECTION || '{}');
            if (!/^[A-Za-z0-9_-]{43,128}$/.test(String(token || ''))) {
              throw new Error('Ponte operacional: token privado ausente');
            }
            const url = 'https://dominium-import-bridge.jogador743.workers.dev/api/toa-contracts?profile=natal';
            const response = await fetch(url, {
              method: 'GET', signal: AbortSignal.timeout(30000),
              headers: {Authorization: 'Bearer ' + token,
                'X-Dominium-Role': 'controller',
                'X-Dominium-Actor': 'github-deploy-readonly'},
            });
            if (response.status !== 200) {
              throw new Error('Ponte operacional indisponivel: HTTP ' + response.status);
            }
            const contentType = response.headers.get('content-type') || '';
            if (!contentType.includes('application/json')) {
              throw new Error('Ponte operacional nao retornou JSON');
            }
            await response.json();
            console.log('Ponte operacional validada: GET TOA HTTP 200');
          })().catch(error => {console.error(error.message); process.exitCode=1;});
          NODE

      - name: Verificar consulta de estoque na API oficial antes do deploy
        shell: bash
        env:
          DOMINIUM_DESC_REVIEW_CONNECTION: ${{ secrets.DOMINIUM_DESC_REVIEW_CONNECTION }}
        run: |
          node <<'NODE'
          (async () => {
            const {token} = JSON.parse(process.env.DOMINIUM_DESC_REVIEW_CONNECTION || '{}');
            if (!/^[A-Za-z0-9_-]{43,128}$/.test(String(token || ''))) throw Error('Credencial privada ausente');
            const response = await fetch(
              'https://dominium-import-bridge.jogador743.workers.dev/api/imperium-official/stocks?profile=natal',
              {method:'GET',signal:AbortSignal.timeout(55000),headers:{
                Authorization:'Bearer '+token,
                'X-Dominium-Actor':'github-readonly-stock-test',
                'X-Dominium-Role':'controller',
              }}
            );
            if (response.status !== 200) throw Error('Estoque oficial indisponivel: HTTP '+response.status);
            const result = await response.json();
            if (!result.ok || !Array.isArray(result.stocks)) throw Error('Contrato de estoque oficial invalido');
            console.log('Consulta de estoque oficial validada');
          })().catch(error=>{console.error(error.message);process.exitCode=1});
          NODE

      - name: Verificar historico DataSnap de seriais antes do deploy
        shell: bash
        env:
          DOMINIUM_DESC_REVIEW_CONNECTION: ${{ secrets.DOMINIUM_DESC_REVIEW_CONNECTION }}
        run: |
          node <<'NODE'
          (async () => {
            const {token} = JSON.parse(process.env.DOMINIUM_DESC_REVIEW_CONNECTION || '{}');
            if (!/^[A-Za-z0-9_-]{43,128}$/.test(String(token || ''))) throw Error('Credencial privada ausente');
            for (const profile of ['natal', 'fortaleza', 'mossoro', 'recife']) {
             for (const mode of ['analitico', 'sintetico']) {
              const endpoint = 'https://dominium-import-bridge.jogador743.workers.dev/api/serials/consult'
                + '?serials=ZZZZZZZZZZZZ&profile=' + profile + '&mode=' + mode;
              const response = await fetch(endpoint, {
                method:'GET', signal:AbortSignal.timeout(60000),
                headers:{ Authorization:'Bearer '+token,
                  'X-Dominium-Actor':'github-serial-readonly-test',
                  'X-Dominium-Role':'controller' }
              });
              if (response.status!==200) throw Error('Consulta serial '+mode+' HTTP '+response.status);
              const data=await response.json();
              if (!data.ok || data.mode!==mode || data.profile!==profile ||
                  !Array.isArray(data.results) || data.results.length!==1 ||
                  !Array.isArray(data.results[0].datasnap?.movements))
                throw Error('Resposta de seriais inesperada: '+profile+' '+mode);
             }
            }
            console.log('Consulta serial validada: 4 pracas x Analitico/Sintetico');
          })().catch(error=>{console.error(error.message); process.exitCode=1});
          NODE

      - name: Verificar coletor privado de REPORTs antes do deploy
        shell: bash
        env:
          DOMINIUM_DESC_REVIEW_CONNECTION: ${{ secrets.DOMINIUM_DESC_REVIEW_CONNECTION }}
        run: |
          node <<'NODE'
          (async () => {
            const {token} = JSON.parse(process.env.DOMINIUM_DESC_REVIEW_CONNECTION || '{}');
            if (!/^[A-Za-z0-9_-]{43,128}$/.test(String(token || ''))) throw Error('Credencial privada ausente');
            const response = await fetch(
              'https://dominium-import-bridge.jogador743.workers.dev/api/disconnection/reports',
              {method:'GET',signal:AbortSignal.timeout(30000),headers:{
                Authorization:'Bearer '+token, 'X-Dominium-Role':'controller',
                'X-Dominium-Actor':'github-report-readonly-test',
              }}
            );
            if (response.status !== 200) throw Error('Coletor REPORT indisponivel: HTTP '+response.status);
            const data = await response.json();
            if (!data.ok || !Array.isArray(data.reports)) throw Error('Formato do coletor REPORT invalido');
            console.log('REPORT privado validado: GET autenticado, sem criar registros');
          })().catch(error=>{console.error(error.message);process.exitCode=1;});
          NODE

      - name: Confirmar QUERY Atlas pela ponte privada sem gerar fila
        shell: bash
        env:
          DOMINIUM_DESC_REVIEW_CONNECTION: ${{ secrets.DOMINIUM_DESC_REVIEW_CONNECTION }}
        run: |
          node <<'NODE'
          (async () => {
            const {token} = JSON.parse(process.env.DOMINIUM_DESC_REVIEW_CONNECTION || '{}');
            if (!/^[A-Za-z0-9_-]{43,128}$/.test(String(token || ''))) throw Error('Credencial privada ausente');
            const response = await fetch(
              'https://dominium-import-bridge.jogador743.workers.dev/api/atlas-query/jobs',
              {method:'GET',signal:AbortSignal.timeout(30000),headers:{
                Authorization:'Bearer '+token,
                'X-Dominium-Role':'controller',
                'X-Dominium-Actor':'user-999999',
              }}
            );
            if (response.status !== 200) throw Error('QUERY Atlas privada indisponivel: HTTP '+response.status);
            const data = await response.json();
            if (!data.ok || !Array.isArray(data.jobs)) throw Error('Resposta QUERY invalida');
            console.log('QUERY privada validada: lista autenticada, sem criar fila');
          })().catch(error=>{console.error(error.message);process.exitCode=1;});
          NODE

      - name: Instalar Hostinger CLI oficial
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/hostinger/api-cli/releases/latest"
          url="$(curl -fsSL "$api" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(a["browser_download_url"] for a in d["assets"] if a["name"].endswith("linux-amd64.tar.gz")))')"
          curl -fsSL "$url" -o /tmp/hostinger.tar.gz
          mkdir -p "$HOME/bin"
          tar -xzf /tmp/hostinger.tar.gz -C "$HOME/bin"
          chmod +x "$HOME/bin/hostinger"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Upload e build na Hostinger
        shell: bash
        env:
          HOSTINGER_API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$HOSTINGER_API_TOKEN" || { echo "::error::HOSTINGER_API_TOKEN ausente"; exit 1; }

          WEBSITE_JSON="$(hostinger hosting websites list --domain "$HOSTINGER_DOMAIN" --format json)"
          echo "$WEBSITE_JSON" | jq -e --arg domain "$HOSTINGER_DOMAIN" '
            (.data // []) | any(.domain == $domain and .is_enabled == true and .website_type == "nodejs")
          ' >/dev/null || {
            echo "::error::O dominio Node.js esperado nao esta disponivel para este token"
            exit 1
          }

          ARCHIVE="output/hostinger-node-release.zip"
          REMOTE_ARCHIVE="dominium-web-${GITHUB_SHA:0:7}.zip"
          SIZE="$(stat -c%s "$ARCHIVE")"

          UPLOAD_JSON="$(hostinger hosting files generate-upload-url             --username "$HOSTINGER_USERNAME"             --domain "$HOSTINGER_DOMAIN"             --format json)"

          UPLOAD_URL="$(echo "$UPLOAD_JSON" | jq -r '.url // .data.url // empty')"
          AUTH_KEY="$(echo "$UPLOAD_JSON" | jq -r '.auth_key // .data.auth_key // empty')"
          REST_AUTH_KEY="$(echo "$UPLOAD_JSON" | jq -r '.rest_auth_key // .data.rest_auth_key // empty')"

          test -n "$UPLOAD_URL" && test -n "$AUTH_KEY" && test -n "$REST_AUTH_KEY" || {
            echo "::error::A Hostinger nao retornou credenciais de upload"
            exit 1
          }

          echo "::add-mask::$UPLOAD_URL"
          echo "::add-mask::$AUTH_KEY"
          echo "::add-mask::$REST_AUTH_KEY"

          DEST="${UPLOAD_URL%/}/$REMOTE_ARCHIVE?override=true"

          CREATE_STATUS="$(curl -sS -o /tmp/tus-create-body -D /tmp/tus-create-headers             -w '%{http_code}' -X POST "$DEST"             -H "X-Auth: $AUTH_KEY"             -H "X-Auth-Rest: $REST_AUTH_KEY"             -H "Tus-Resumable: 1.0.0"             -H "Upload-Length: $SIZE"             -H "Upload-Offset: 0")"
          test "$CREATE_STATUS" = "201" || {
            echo "::error::Falha ao criar upload Hostinger (HTTP $CREATE_STATUS)"
            exit 1
          }

          PATCH_STATUS="$(curl -sS -o /tmp/tus-patch-body -D /tmp/tus-patch-headers             -w '%{http_code}' -X PATCH "$DEST"             -H "X-Auth: $AUTH_KEY"             -H "X-Auth-Rest: $REST_AUTH_KEY"             -H "Tus-Resumable: 1.0.0"             -H "Content-Type: application/offset+octet-stream"             -H "Upload-Offset: 0"             --data-binary "@$ARCHIVE")"
          test "$PATCH_STATUS" = "204" || {
            echo "::error::Falha no upload Hostinger (HTTP $PATCH_STATUS)"
            exit 1
          }

          UPLOADED_OFFSET="$(awk 'BEGIN{IGNORECASE=1} /^upload-offset:/ {gsub("\r","",$2); print $2}' /tmp/tus-patch-headers | tail -1)"
          if [ -n "$UPLOADED_OFFSET" ] && [ "$UPLOADED_OFFSET" != "$SIZE" ]; then
            echo "::error::Upload incompleto: $UPLOADED_OFFSET de $SIZE bytes"
            exit 1
          fi

          SOURCE_OPTIONS="$(jq -cn --arg archive "$REMOTE_ARCHIVE" '{archive_path:$archive}')"
          BUILD_JSON="$(hostinger hosting nodejs start-build             "$HOSTINGER_USERNAME" "$HOSTINGER_DOMAIN"             --node-version 22             --app-type express             --root-directory ""             --output-directory "."             --build-script build             --entry-file server.js             --package-manager npm             --source-type archive             --source-options "$SOURCE_OPTIONS"             --format json)"

          BUILD_UUID="$(echo "$BUILD_JSON" | jq -r '.uuid // .data.uuid // empty')"
          test -n "$BUILD_UUID" || {
            echo "::error::A Hostinger nao retornou UUID do build"
            exit 1
          }

          echo "Build Hostinger iniciado."
          COMPLETED=0
          for attempt in $(seq 1 45); do
            DETAILS="$(hostinger hosting nodejs build               "$HOSTINGER_USERNAME" "$HOSTINGER_DOMAIN" "$BUILD_UUID"               --format json)"
            STATE="$(echo "$DETAILS" | jq -r '.state // .data.state // empty')"
            echo "Build Hostinger: $STATE"
            case "$STATE" in
              completed)
                COMPLETED=1
                break
                ;;
              failed)
                echo "::error::Build Hostinger falhou"
                hostinger hosting nodejs build-logs                   "$HOSTINGER_USERNAME" "$HOSTINGER_DOMAIN" "$BUILD_UUID"                   --format table || true
                exit 1
                ;;
              pending|running|"")
                sleep 8
                ;;
              *)
                echo "::error::Estado de build inesperado: $STATE"
                exit 1
                ;;
            esac
          done

          test "$COMPLETED" = "1" || {
            echo "::error::Timeout aguardando build Hostinger"
            exit 1
          }

          hostinger hosting nodejs restart-application             "$HOSTINGER_USERNAME" "$HOSTINGER_DOMAIN"             --yes --format json >/dev/null

      - name: Smoke tests de producao
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://dominium.clarotechnet.com.br"

          READY=0
          for attempt in $(seq 1 20); do
            STATUS="$(curl -sS -o /tmp/dominium-session.json -w '%{http_code}' "$BASE/api/auth/session" || true)"
            if [ "$STATUS" = "200" ] && jq -e '.ok == true' /tmp/dominium-session.json >/dev/null 2>&1; then
              READY=1
              break
            fi
            sleep 5
          done
          test "$READY" = "1" || {
            echo "::error::DOMINIUM nao ficou pronto apos o deploy"
            exit 1
          }

          jq -e '.registration_enabled == true' /tmp/dominium-session.json >/dev/null || {
            echo "::error::Cadastro publico nao esta habilitado"
            exit 1
          }

          curl -fsS "$BASE/" >/dev/null
          curl -fsS "$BASE/app.js" -o /tmp/dominium-app.js
          grep -q "autoImproductiveToggle" /tmp/dominium-app.js || {
            echo "::error::Frontend novo nao foi publicado"
            exit 1
          }

          REGISTER_STATUS="$(curl -sS -o /tmp/register.json -w '%{http_code}'             -X POST "$BASE/api/auth/register"             -H 'Content-Type: application/json'             --data '{}')"
          test "$REGISTER_STATUS" = "400" || {
            echo "::error::Cadastro publico nao respondeu com validacao esperada (HTTP $REGISTER_STATUS)"
            cat /tmp/register.json || true
            exit 1
          }
          jq -e '.error | type == "string" and length > 0' /tmp/register.json >/dev/null || {
            echo "::error::Cadastro publico nao retornou erro de validacao estruturado"
            exit 1
          }

          AUTO_STATUS="$(curl -sS -o /tmp/auto.json -w '%{http_code}'             "$BASE/api/auto-improductive-close")"
          test "$AUTO_STATUS" = "401" || {
            echo "::error::Ponte operacional retornou HTTP $AUTO_STATUS"
            exit 1
          }

          DOT_STATUS="$(curl -sS -o /dev/null -w '%{http_code}' "$BASE/.env")"
          case "$DOT_STATUS" in
            403|404) ;;
            *)
              echo "::error::Dotfile nao foi bloqueado: HTTP $DOT_STATUS"
              exit 1
              ;;
          esac

          echo "DOMINIUM production smoke tests: OK"
