name: Testar FTP DOMINIUM

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/test-dominium-ftp.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Instalar cliente SFTP
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass

      - name: Testar SFTP DOMINIUM em modo leitura
        shell: bash
        env:
          FTP_SERVER: ${{ secrets.HOSTINGER_FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
        run: |
          set -u
          for name in FTP_SERVER FTP_USERNAME FTP_PASSWORD; do
            test -n "${!name}" || { echo "::error::Secret ausente: $name"; exit 1; }
          done

          cat > /tmp/sftp-batch <<'EOF'
          pwd
          ls -la
          ls -la public_html
          ls -la domains
          ls -la dominium
          ls -la dominium.clarotechnet.com.br
          bye
          EOF

          set +e
          SSHPASS="$FTP_PASSWORD" sshpass -e sftp             -o StrictHostKeyChecking=no             -o UserKnownHostsFile=/dev/null             -o ConnectTimeout=10             -P 65002             -b /tmp/sftp-batch             "$FTP_USERNAME@$FTP_SERVER"
          code=$?
          echo "SFTP_EXIT=$code"
          exit "$code"
