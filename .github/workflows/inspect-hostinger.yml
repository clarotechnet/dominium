name: Diagnosticar Hostinger DOMINIUM

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/inspect-hostinger.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Instalar cliente FTP
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Localizar app DOMINIUM no FTP
        shell: bash
        env:
          FTP_SERVER: ${{ secrets.HOSTINGER_FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_SERVER" <<'LFTP'
          set ftp:ssl-allow no
          set net:timeout 10
          set net:max-retries 1
          echo === ROOT ===
          pwd
          cls -la
          echo === PUBLIC_HTML ===
          cd public_html
          pwd
          cls -la
          echo === CANDIDATES ===
          find .
          bye
          LFTP
