name: Diagnosticar Hostinger DOMINIUM

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Instalar cliente FTP
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Listar estrutura da conta Hostinger
        shell: bash
        env:
          FTP_SERVER: ${{ secrets.HOSTINGER_FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          for name in FTP_SERVER FTP_USERNAME FTP_PASSWORD; do
            test -n "${!name}" || { echo "::error::Secret ausente: $name"; exit 1; }
          done
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_SERVER" <<'LFTP'
          set ftp:ssl-allow no
          set net:timeout 10
          set net:max-retries 1
          pwd
          cls -1
          cls -1 domains || true
          cls -1 domains/clarotechnet.com.br || true
          cls -1 domains/clarotechnet.com.br/public_html || true
          bye
          LFTP
