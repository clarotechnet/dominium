name: Diagnosticar Hostinger DOMINIUM

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/inspect-hostinger.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Instalar cliente SFTP
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass

      - name: Localizar app DOMINIUM via SFTP
        shell: bash
        env:
          SFTP_SERVER: ${{ secrets.HOSTINGER_FTP_SERVER }}
          SFTP_USERNAME: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          SFTP_PASSWORD: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          cat > /tmp/sftp-batch <<'EOF'
          pwd
          ls -la
          ls -la domains
          ls -la domains/clarotechnet.com.br
          ls -la domains/clarotechnet.com.br/public_html
          ls -la domains/dominium.clarotechnet.com.br
          ls -la nodejs
          ls -la .nodejs
          bye
          EOF
          SSHPASS="$SFTP_PASSWORD" sshpass -e sftp -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -P 65002 -b /tmp/sftp-batch "$SFTP_USERNAME@$SFTP_SERVER"
